name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # with numba: exercises the compiled backend
          - os: ubuntu-latest
            python: "3.10"         # oldest supported (requires-python)
            extras: "[dev,fast]"
          - os: ubuntu-latest
            python: "3.13"
            extras: "[dev,fast]"
          # without numba: exercises the NumPy fallback
          - os: windows-latest
            python: "3.11"
            extras: "[dev]"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".${{ matrix.extras }}"
      - name: Unit tests
        run: pytest -q
      - name: Selftest (analytic flows)
        run: python -m lcs2d selftest
      - name: Build sdist and wheel
        run: python -m build
