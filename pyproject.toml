[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lcs2d"
dynamic = ["version"]
description = "Lagrangian coherent structures (FTLE / FSLE) from steady 2D velocity fields"
readme = "README.md"
authors = [{ name = "Jeffrey A. Tuhtan", email = "jtuhtan@gmail.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
fast = ["numba>=0.57"]
dev = ["pytest>=7", "build"]

[project.urls]
Homepage = "https://github.com/jtuhtan/LCS2D"

[project.scripts]
lcs2d = "lcs2d.cli:main"

[tool.setuptools]
packages = ["lcs2d"]

[tool.setuptools.dynamic]
version = { attr = "lcs2d.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
