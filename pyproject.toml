[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lcs2d"
version = "2.0.0"
description = "Lagrangian coherent structures (FTLE / FSLE) from steady 2D velocity fields"
readme = "README.md"
authors = [{ name = "Jeffrey A. Tuhtan", email = "jtuhtan@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
fast = ["numba>=0.57"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jtuhtan/LCS2D"

[project.scripts]
lcs2d = "lcs2d.cli:main"

[tool.setuptools]
packages = ["lcs2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
